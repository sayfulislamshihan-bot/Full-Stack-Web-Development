<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid green;
            max-width: 80vw;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        .form input{
            margin-top: 10px;
            width: 100%;
        }
        .form-container{
            border: 2px solid red;
            width: 1000px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .form{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Login Form</h2>
            <form class="form">
                <input type="text" name="" id="" placeholder="Name" required>
                <input type="email" name="" id="" placeholder="Email" required>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>
</body>
</html>
