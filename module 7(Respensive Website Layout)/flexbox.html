<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            border: 5px solid blue;
            height: 1200px;
            width: 1200px;
            display: flex;
            justify-content:center;
            align-items: center;
            flex-wrap: wrap;
            flex-direction:row-reverse;
        }
        .Box-container{
            height: 200px;
            width: 200px;
            border: 4px dotted green;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="Box-container">Box-1</div>
       <div class="Box-container">Box-2</div>
       <div class="Box-container">Box-3</div>
       <div class="Box-container">Box-4</div>
       <div class="Box-container">Box-5</div>
       <div class="Box-container">Box-6</div>
       <div class="Box-container">Box-7</div>
    </div>
</body>
</html>
