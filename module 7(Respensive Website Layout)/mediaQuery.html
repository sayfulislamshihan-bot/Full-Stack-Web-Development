<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display:flex;
        gap: 10px;
        height: 100vh;
    }
    .box1{
        width: 30%;
        background-color: antiquewhite;
        border-radius: 5px;
        height: 100%;
        display: flex;
        justify-content:center;
        align-items: center;
    }
    .box2{
        width: 70%;
        background-color: aquamarine;
        border-radius: 5px;
        height: 100%;
        display: flex;
        justify-content:center;
        align-items: center;
}

@media screen and (max-width: 576px){
    .container{
        display:grid;
        grid-template-columns: repeat(1,1fr);
    }
    .box1{
        width: 100%;
    }
    .box2{
        width: 100%;
    }
}
</style>
<body>
    <div class="container">
        <div class="box1"><h3>Left</h3></div>
        <div class="box2"><h3>Right</h3></div>
    </div>
</body>
</html>
