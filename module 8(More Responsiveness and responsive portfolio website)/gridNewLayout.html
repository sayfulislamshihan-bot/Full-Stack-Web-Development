<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr) 50px 50px;
            gap: 20px;
        }
        #big-layout{
            grid-row: span 4;
            grid-column: span 1;
        }
        #medium-layout{
            grid-column: span 1;
            /
        }
        .box{
            background-color: gray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="big-layout" class="box">Box-1</div>
        <div id="medium-layout" class="box">Box-2</div>
        <div id="medium-layout" class="box">Box-3</div>
        <div id="medium-layout" class="box">Box-4</div>
        <div id="medium-layout" class="box">Box-5</div>
        <div id="medium-layout" class="box">Box-6</div>
        <div id="medium-layout" class="box">Box-7</div>
        <div id="medium-layout" class="box">Box-8</div>
        <div id="medium-layout" class="box">Box-9</div>
        <div id="medium-layout" class="box">Box-10</div>
        <div  class="box">Box-11</div>
        <div class="box">Box-12</div>
    </div>
</body>
</html>
