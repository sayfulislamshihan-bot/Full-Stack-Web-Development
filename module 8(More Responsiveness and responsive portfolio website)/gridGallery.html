<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 150px);
            gap: 3px;
        }
        .container img{
            width: 100%;
            height: 100%;
        }
        .big-layout{
            grid-column: span 6;
            grid-row: span 2;
        }
        .normal-layout{
            grid-column: span 2;
            grid-row: span 2;
        }
        .colStratch-layout{
            grid-column: span 2;
            grid-row: span 1;
        }
        .small-layout{
            grid-column: span 1;
            grid-row: span 1;
        }

        @media screen and (max-width:576px){
           .container{
                display: block;
           }
        }

        @media screen and (min-width:577px) and (max-width:992px){
            .container{
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(6, 150px);
            }
            .big-layout, .normal-layout, .colStratch-layout, .small-layout{
                grid-column: span 1;
                grid-row: span 1;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="big-layout"><img src="./grid images/A.jpg" alt=""></div>
        <div class="normal-layout"><img src="./grid images/B.jpg" alt=""></div>
        <div class="normal-layout"><img src="./grid images/C.jpg" alt=""></div>
        <div class="colStratch-layout"><img src="./grid images/D.jpg" alt=""></div>
        <div class="colStratch-layout"><img src="./grid images/E.jpg" alt=""></div>
        <div class="normal-layout"><img src="./grid images/F.jpg" alt=""></div>
        <div class="small-layout"><img src="./grid images/G.jpg" alt=""></div>
        <div class="small-layout"><img src="./grid images/G.jpg" alt=""></div>
        <div class="normal-layout"><img src="./grid images/I.jpg" alt=""></div>
        <div class="small-layout"><img src="./grid images/G.jpg" alt=""></div>
        <div class="small-layout"><img src="./grid images/G.jpg" alt=""></div>
    </div>
</body>
</html>
