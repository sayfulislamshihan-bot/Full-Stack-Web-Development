<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event form</title>
    <style>
        .block-form{
            height: 1000px;
            background-color: antiquewhite;
            margin: 0 auto;
        }
        .fe{
             display: block;
        }
    </style>
</head>
<body>
    <main>
        <h2>Welcome Enter Your Feedback</h2>
        <form class="block-form">
            <caption>Feedback Form:</caption>
            <div>
            <label for="">Enter name</label>
            <input type="text" name="" id="">               
            </div>
            <div>
            <label for=""></label>
            <select name="" id="">
                <option value="initial">Please choose an option</option>
                <option value="Good">Good</option>
                <option value="">Excellent</option>
                <option value="">Bad</option>
                <option value="">Terrible</option>
            </select>
            </div>
            <textarea class="fe" rows="20" cols="50" placeholder="Drop the comment"></textarea>
            <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </form>
    </main>
</body>
</html>
